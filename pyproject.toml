[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
# Strict per module, widened one module at a time. sql_guard.py (8 errors) and
# phi_guard.py (62) need annotations in the guard itself, so they get their
# own PRs, which the owner merges.
[[tool.mypy.overrides]]
module = ["critic", "nightly_alerts"]
strict = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "demo_*.py", "scripts/*", "*/site-packages/*", "setup.py"]

[tool.coverage.report]
skip_empty = true
