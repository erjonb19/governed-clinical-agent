
# ---- Code quality gates (backlog item 15), enforced in tests.yml -------------
# Gradual by design: each gate starts at today's level and only ratchets up.
[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]   # not the code blocks in Markdown

[tool.ruff.lint]
# Today's floor: syntax errors, undefined names, invalid comparisons -- zero of
# them in the repo (2026-11-09). Next to add: F401/F811/F841 (45 hits, many in
# src/ and the guard's neighbours, so a separate PR).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# A ratchet: every Python file is checked EXCEPT these, which predate the gate
# (2026-11-09). Format a file in its own small PR and delete it from this list;
# new files are checked from day one. Guard files (sql_guard.py, phi_guard.py)
# are reformatted only in a PR the owner merges.
