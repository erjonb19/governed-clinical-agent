# The same gates as CI (tests.yml, backlog item 15), run before each commit:
#   pip install pre-commit ruff==0.16.9 mypy==2.3.1 && pre-commit install
# Local hooks on the installed tools (the versions tests.yml pins); rules, the
# format ratchet and the strict modules live in pyproject.toml, so the hooks
# and CI read the same settings.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict modules)
        entry: mypy critic.py nightly_alerts.py
        language: system
        pass_filenames: false
        types: [python]
