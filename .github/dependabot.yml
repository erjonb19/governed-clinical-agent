# Dependabot (backlog item 16): weekly, grouped, so updates arrive as three PRs a
# week at most -- Python packages, GitHub Actions and Docker images. Each runs the
# full CI like any PR, then merges under rule 0 (CLAUDE.md) once green and reviewed.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"           # requirements-api.txt, requirements.txt, setup.py
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # a version must be a week old before Dependabot proposes it (audit item 46):
    # most malicious releases are caught and yanked within days. Security
    # updates are not delayed by a cooldown.
    cooldown:
      default-days: 7
    # The guard's own pins (setup.py GUARD_PINS = requirements-api.txt): a new
    # sqlglot once made the PHI check refuse every FHIR query (30.29.0), so
    # bumping them is a deliberate guard change the owner merges, never a
    # grouped weekly update.
    ignore:
      - dependency-name: sqlglot
      - dependency-name: duckdb
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # base images, pinned by digest (audit item 50): Dependabot proposes the new
  # digest when the tag moves. The Postgres service image in tests.yml and the
  # Phoenix image in docker-compose.yml are bumped by hand.
  - package-ecosystem: docker
    directories: ["/", "/docker"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]
