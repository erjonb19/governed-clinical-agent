# Dependabot (backlog item 16): weekly, grouped, so updates arrive as two PRs a
# week at most -- one for Python packages, one for GitHub Actions. Each runs the
# full CI like any PR; merging stays a person's decision.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"           # requirements-api.txt, requirements.txt, setup.py
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
