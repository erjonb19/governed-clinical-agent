# .github/workflows/eval-nightly.yml
# Full evaluation suite on a nightly schedule. Runs all cases, multiple times
# each, for complete coverage and the real accuracy number. Does not run on
# push (that is the quick gate's job), so it never slows down development.

name: eval (full nightly)

on:
  schedule:
    - cron: "0 7 * * *"         # 07:00 UTC daily (~2-3am ET)
  workflow_dispatch:            # allows manual full runs any time

# one nightly at a time: a manual run overlapping the scheduled one could open
# the same alert issue twice
concurrency:
  group: eval-nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write       # nightly_alerts.py opens, comments on and closes alert issues (item 3)

jobs:
  full-eval:
    runs-on: ubuntu-latest
    # two attempts (~23 min each when healthy) + 5 min wait; each attempt is
    # capped at 32 min by the gate so an overrun is red, not "cancelled"
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Fail fast with a clear message if the planner key is absent. Without it,
      # NLToSQLPlanner.__init__ raises SystemExit and the job dies in ~20s with a
      # cryptic exit 1 that looks like an eval failure but is really a setup gap.
      - name: Verify required secret is present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Missing secret::GEMINI_API_KEY is not set for this workflow. The eval planner uses the Gemini provider and cannot run without it. Add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "GEMINI_API_KEY is present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Note the start time
        id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run full eval (all cases, 3 runs each)
        id: gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANNER_PROVIDER: "gemini"      # gemini free tier has headroom for the full suite
          PLANNER_MIN_INTERVAL_SEC: "5"  # ~12 RPM: stays under the Gemini free-tier per-minute cap
          EVAL_RUNS: "3"
          EVAL_ATTEMPT_TIMEOUT_MIN: "32"
        # Exit 1 (below the gate) is red. Exit 2 (provider unavailable or cases
        # unanswered) is retried once after 5 minutes, then red: owner's
        # decision 2026-11-06, backlog item 1 (scripts/eval_gate.sh).
        run: |
          set +e
          scripts/eval_gate.sh retry-then-fail --runs 3
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-nightly
          path: eval_runs/

      # Item 3: eval-regression or provider-outage issue, never mixed; the next
      # healthy night closes it. Only when the gate actually ran.
      - name: Alert (open, update or close the issue)
        if: always() && steps.gate.outputs.rc != ''
        continue-on-error: true   # a GitHub API hiccup must not turn a green night red
        env:
          GH_TOKEN: ${{ github.token }}
        run: python nightly_alerts.py --dataset hospital --gate-exit "${{ steps.gate.outputs.rc }}" --since "${{ steps.start.outputs.t }}"

  # Second dataset: the 28-case FHIR clinical suite. Runs AFTER the hospital job
  # (needs: full-eval) -- both share one provider key, and running them in
  # parallel doubles the request rate and trips 429s despite per-process pacing.
  # Its Gold DB is a derived artifact (gitignored), so this job builds it from the
  # Synthea source, cached so we don't refetch every night.
  fhir-eval:
    needs: full-eval
    # still runs when the hospital job is red: each dataset gets its own verdict
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # two attempts (~15 min each when healthy) + 5 min wait, each capped at 25
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify required secret is present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Missing secret::GEMINI_API_KEY is not set for this workflow. The eval planner uses the Gemini provider and cannot run without it."
            exit 1
          fi
          echo "GEMINI_API_KEY is present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt pyarrow   # pyarrow: build_fhir_gold._to_arrow

      # Cache the Synthea download + built Gold so we don't refetch hundreds of
      # MB nightly. The key is tied to the build scripts, so it rebuilds only when
      # fetch/build logic changes.
      - name: Cache FHIR Gold
        id: fhir-cache
        uses: actions/cache@v4
        with:
          path: |
            data/synthea
            medallion/fhir_gold.duckdb
          key: fhir-gold-${{ hashFiles('fetch_synthea.py', 'build_fhir_gold.py') }}

      - name: Build FHIR Gold (on cache miss)
        if: steps.fhir-cache.outputs.cache-hit != 'true'
        run: |
          python fetch_synthea.py
          python build_fhir_gold.py

      # 3 runs: Gemini's free tier has the headroom Groq lacked. Verified locally
      # at 100% (28/28 cases) with 5s pacing.
      - name: Note the start time
        id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run FHIR eval (28 cases, 3 runs each)
        id: gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANNER_PROVIDER: "gemini"         # gemini free tier has headroom for the full suite
          PLANNER_MIN_INTERVAL_SEC: "5"      # ~12 RPM: stays under the Gemini free-tier per-minute cap
          EVAL_DATASET: "fhir"               # select the FHIR bank + fhir_gold.duckdb
          PLANNER_SCHEMA: "fhir"             # must be set in env (planner reads it at import)
          EVAL_RUNS: "3"
          EVAL_ATTEMPT_TIMEOUT_MIN: "25"
        # Exit 2 = provider unavailable -> one retry, then red (see hospital job).
        run: |
          set +e
          scripts/eval_gate.sh retry-then-fail --runs 3
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload FHIR eval report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-fhir-nightly
          path: eval_runs/

      - name: Alert (open, update or close the issue)
        if: always() && steps.gate.outputs.rc != ''
        continue-on-error: true   # a GitHub API hiccup must not turn a green night red
        env:
          GH_TOKEN: ${{ github.token }}
        run: python nightly_alerts.py --dataset fhir --gate-exit "${{ steps.gate.outputs.rc }}" --since "${{ steps.start.outputs.t }}"
