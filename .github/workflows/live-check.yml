# .github/workflows/live-check.yml
# Nightly check that the deployed service is up (PLAN v2 7d). Loads /health and
# /ui on Render in headless Chromium, with no API key: no LLM call, $0.
#
# Render's free tier sleeps, so live_check.py retries (3 attempts, 90s each,
# 30s apart) and only an all-attempts failure counts. A failure opens ONE issue
# labelled `live-check`, or comments on the open one; the next pass closes it.

name: live check (deployed service)

on:
  schedule:
    - cron: "30 6 * * *"        # 06:30 UTC daily, before the 07:00 Gemini nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # 3 x (90s + 90s) + pauses + apt; a cancelled job files no issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-e2e.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-e2e.lock
          python -m playwright install --with-deps chromium

      - name: Check the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python live_check.py --file-issue --screenshot-dir live-check-shots

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-check-screenshots
          path: live-check-shots/
          if-no-files-found: ignore
