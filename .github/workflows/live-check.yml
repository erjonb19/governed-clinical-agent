# .github/workflows/live-check.yml
# Nightly check that the deployed service is up (PLAN v2 7d). Loads /health and
# /ui on Render in headless Chromium, with no API key: no LLM call, $0.
#
# Render's free tier sleeps, so live_check.py retries (3 attempts, 90s each,
# 30s apart) and only an all-attempts failure counts. A failure opens ONE issue
# labelled `live-check`, or comments on the open one; the next pass closes it.

name: live check (deployed service)

on:
  schedule:
    - cron: "30 6 * * *"        # 06:30 UTC daily, before the 07:00 Gemini nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-e2e.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Check the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python live_check.py --file-issue --screenshot-dir live-check-shots

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: live-check-screenshots
          path: live-check-shots/
          if-no-files-found: ignore
