# .github/workflows/load-test.yml -- /query under concurrency on RECORDED model
# answers (backlog item 20; docs/benchmarks.md). Dispatch only: a benchmark is
# run on purpose, not on every push. $0, no secrets, no model calls.
name: load test

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "requests per concurrency level"
        default: "200"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
      - name: Run at 1, 5 and 20 concurrent users
        env:
          REQUESTS: ${{ inputs.requests }}
        run: python scripts/load_test.py --requests "$REQUESTS" --json load.json
      - uses: actions/upload-artifact@v7
        with:
          name: load-test
          path: load.json
