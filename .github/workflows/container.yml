# .github/workflows/container.yml -- the API image (backlog item 17): built,
# started, smoke-tested and scanned on every push. Nothing is pushed to a
# registry: publishing the image (GHCR) is the owner's call.
name: container

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t governed-clinical-agent:ci .

      - name: Start it and wait for the HEALTHCHECK
        run: |
          docker run -d --name api -p 8000:8000 -e API_KEY=ci-key governed-clinical-agent:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "health: $s"; [ "$s" = healthy ] && break; sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] || { docker logs api; exit 1; }
          [ "$(docker inspect -f '{{.Config.User}}' api)" = app ] || { echo "not the non-root user"; exit 1; }

      - name: Smoke test (health, auth, the guard)
        run: |
          curl -fsS localhost:8000/v1/health | tee /tmp/h.json
          python3 -c "import json;d=json.load(open('/tmp/h.json'));assert d['git_commit']=='${{ github.sha }}', d"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/traces)" = 401
          curl -fsS -X POST localhost:8000/v1/raw-sql -H 'X-API-Key: ci-key' -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT count(*) AS n FROM gold_hospital_profile"}' | grep -q '"allowed":true'
          curl -fsS -X POST localhost:8000/v1/raw-sql -H 'X-API-Key: ci-key' -H 'Content-Type: application/json' \
            -d '{"sql":"DROP TABLE gold_hospital_profile"}' | grep -q '"allowed":false'

      - name: Memory at idle (Render budget, item 17)
        run: docker stats --no-stream --format 'memory {{.MemUsage}}' api

      # Trivy, from its own image pinned by DIGEST (0.58.2, Jan 2025), not the
      # trivy-action wrapper: a digest cannot be moved under us, a tag can.
      - name: Scan (Trivy; fail on fixable CRITICAL findings)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            governed-clinical-agent:ci
