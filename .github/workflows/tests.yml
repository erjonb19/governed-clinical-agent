# .github/workflows/tests.yml
# Unit / integration / security test suite (pytest). Separate from the eval
# gate: the evals measure agent accuracy; this checks the runtime, guard,
# redaction, policy, taint, and injection code. No API keys needed.

name: tests (pytest)

# Every push to any branch, every PR, and nightly (backlog item 1).
on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 7 * * *"   # nightly, beside eval-nightly.yml (07:00)
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements.txt pytest pytest-cov==7.1.0

      # Code quality gates (backlog item 15), each at today's level and only
      # ratcheting up; config in pyproject.toml. Pinned so a new tool release
      # cannot turn a push red on its own.
      - name: Lint (ruff)
        run: |
          pip install ruff==0.16.9
          ruff check .
          ruff format --check .      # every file except the ratchet list in pyproject

      - name: Types (mypy, strict on the listed modules)
        run: |
          pip install mypy==2.3.1
          mypy critic.py nightly_alerts.py

      # No deselects: the ENTIRE suite runs. The six previously-deselected tests
      # were triaged and fixed -- two were real bugs in the explainer (a sensitive
      # path leaked into denial messages, and approval denials were misreported as
      # path denials), the rest were bad test expectations. Network-marked tests
      # remain opt-in and are skipped here.
      # Coverage floor: 67% of the app code (tests, demos and scripts not
      # counted; measured 68.8% on 2026-11-09, so ~1.8 points of headroom).
      # Raise it as tests are added.
      - name: Run tests (pytest, with the coverage floor)
        run: pytest -q -m "not network" --cov --cov-report=term --cov-fail-under=67

  # Known vulnerabilities in the pinned dependencies (backlog item 16), from the
  # PyPA advisory database. A new advisory against a pin turns the push red.
  # The two oauthlib advisories are ignored BY NAME until the owner decides:
  # the fix (oauthlib 4.0.1) needs databricks-sql-connector 4.4.0 -> 4.9.0,
  # which cannot be re-checked against a real workspace until the Databricks
  # secrets exist (backlog item 10). Remove the --ignore-vuln lines with it.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Audit the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off -r requirements-api.txt -r requirements.txt \
            --ignore-vuln PYSEC-2026-4114 --ignore-vuln CVE-2026-49272

  # The same suite against Postgres (backlog item 19): STATE_DB_URL points the
  # approval store and both graphs' checkpointers at a Postgres 16 service
  # container, so every approval, escalation, resume and "no rows in the
  # checkpoint" test runs on both backends; tests/integration/test_state_postgres.py
  # adds the redeploy check. No hosted database: the container lives and dies
  # with the job.
  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: state_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # the suite only ever uses TEST_STATE_DB_URL, on a database named *test*
      # (tests/conftest.py), never STATE_DB_URL
      TEST_STATE_DB_URL: postgresql://ci:ci@localhost:5432/state_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements.txt pytest

      - name: Run tests on Postgres state
        run: pytest -q -m "not network"

  # The documented dev install (`pip install -e ".[dev]"`, CLAUDE.md) must give
  # the guard the SAME sqlglot and duckdb as requirements-api.txt. Before the
  # pins in setup.py it installed no sqlglot at all, and a hand-installed newer
  # one (30.29.0) made phi_guard fail closed on every FHIR query. This job
  # installs ONLY that way, in a clean environment, and runs the guard tests.
  guard-editable-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the package the documented way
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip list | grep -iE '^(sqlglot|duckdb) '

      - name: Run the guard tests
        run: >-
          pytest -q tests/security/test_phi_guard.py tests/security/test_guard_escapes.py
          tests/unit/test_dependency_pins.py
