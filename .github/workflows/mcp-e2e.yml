# .github/workflows/mcp-e2e.yml
# MCP end to end on every push (PLAN v2 7b): a real MCP client connects over
# stdio, over standalone Streamable HTTP, and to /mcp mounted in the API, and
# on each lists tools, runs one allowed query and one blocked query; over HTTP it
# also checks 401 without a key and both header forms. No LLM, no secrets, $0.

name: e2e (MCP)

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# read-only token for every job (audit item 48); a job that needs more asks for it
permissions:
  contents: read

jobs:
  mcp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.lock

      - name: MCP over stdio, standalone HTTP and /mcp
        env:
          RUN_E2E: "1"
        run: pytest -q tests/e2e/test_mcp_e2e.py
