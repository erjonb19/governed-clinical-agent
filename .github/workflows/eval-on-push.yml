# .github/workflows/eval-on-push.yml
# Quick evaluation gate on every push (backlog items 1 and 13).
#
# The hospital and FHIR subsets REPLAY committed model answers
# (PLANNER_PROVIDER=replay, tests/evals/recordings/push_gate.json): zero tokens,
# seconds, and none of Gemini's free daily quota, which the nightly needs
# (owner's decision 2026-11-08, item 13). They still run the real harness,
# guard, Gold and scoring, so a broken guard, schema note, harness or Gold turns
# them red. A prompt, schema note or question changed without re-recording is a
# REPLAY MISS and fails the gate (python scripts/record_push_gate.py fixes it).
# They do not measure a model: the nightly and the manual FHIR eval stay live on
# Gemini for that.
#
# A small live check (3 hospital cases) runs on Groq, the fallback model
# (item 8), so a live provider is still exercised on every push. It needs the
# GROQ_API_KEY repository secret and skips with a warning when it is missing.

name: eval (quick gate)

# Every push to any branch (backlog item 1). No pull_request trigger: a push to
# a PR branch already runs this.
on:
  push:
  workflow_dispatch:        # allows manual runs from the Actions tab

jobs:
  quick-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      # Replayed: any failure is red, including a replay miss (exit 1). There is
      # no provider to be unavailable, so no warn mode.
      - name: Run quick eval (subset, replayed)
        env:
          PLANNER_PROVIDER: "replay"
          ALLOW_REPLAY: "1"
          REPLAY_STORE: "tests/evals/recordings/push_gate.json"
          EVAL_SUBSET: "1"        # harness runs the tagged subset only
          EVAL_RUNS: "1"          # one run per case: a replay answers the same every time
        run: python -u eval_harness.py

      - name: Upload eval report
        if: always()              # keep the report even if the gate fails
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-quick
          path: eval_runs/

  # FHIR subset (backlog item 1, owner's decision 2026-11-06): 13 cases covering
  # every tier, both modes and every FHIR table (tests/unit/test_fhir_subset.py);
  # the full 28 run nightly, live.
  fhir-quick-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt pyarrow   # pyarrow: build_fhir_gold._to_arrow

      # the same cache as the nightly FHIR job (a branch reads main's cache)
      - name: Cache FHIR Gold
        id: fhir-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/synthea
            medallion/fhir_gold.duckdb
          key: fhir-gold-${{ hashFiles('fetch_synthea.py', 'build_fhir_gold.py') }}

      - name: Build FHIR Gold (on cache miss)
        if: steps.fhir-cache.outputs.cache-hit != 'true'
        run: |
          python fetch_synthea.py
          python build_fhir_gold.py

      - name: Run FHIR quick eval (subset, replayed)
        env:
          PLANNER_PROVIDER: "replay"
          ALLOW_REPLAY: "1"
          REPLAY_STORE: "tests/evals/recordings/push_gate.json"
          EVAL_DATASET: "fhir"
          PLANNER_SCHEMA: "fhir"
          EVAL_SUBSET: "1"
          EVAL_RUNS: "1"
        run: python -u eval_harness.py

      - name: Upload FHIR eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-fhir-quick
          path: eval_runs/

  # Live, on Groq: three hospital cases across tiers, so the fallback model and
  # a real provider call are exercised on every push. Paced for Groq's free tier
  # (8K tokens/min, item 13). A provider outage or a missing key warns; a real
  # accuracy drop (exit 1) is red.
  groq-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Check for the Groq key
        id: key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning title=Live Groq check skipped::GROQ_API_KEY is not a repository secret yet (Settings -> Secrets and variables -> Actions). The replayed gates above still ran."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Run 3 live cases on Groq
        if: steps.key.outputs.present == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PLANNER_PROVIDER: "groq"
          PLANNER_MIN_INTERVAL_SEC: "20"
          # t2_avg_mspb_pa is not here (owner, 2026-11-09): Groq's gpt-oss-120b
          # appends ORDER BY ... LIMIT 1 to that one-row average, which DuckDB
          # refuses. It stays in the bank and in every Gemini eval. README.
          EVAL_CASES: "t1_count_all,t2_count_ny_5star,t4_best_value_top10"
          EVAL_RUNS: "1"
        run: scripts/eval_gate.sh warn

      - name: Upload eval report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-groq-live
          path: eval_runs/
