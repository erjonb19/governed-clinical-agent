# .github/workflows/eval-fhir-manual.yml
# The full 28-case FHIR eval on a CHOSEN BRANCH, started by hand (owner's
# request 2026-11-02: run it on a GitHub runner, not the laptop). Same build and
# provider as the nightly FHIR job. By default (backlog item 11) it scores the
# branch AND main in the same workflow and passes only if the branch's accuracy
# over completed runs is at least main's -- the bar for merging a PR that
# touches the FHIR guard or planner. Either run inconclusive (provider
# unavailable, a case unanswered) fails too: not a pass for a merge decision.
# Comparing costs two sweeps of Gemini's free daily quota (~2 x 84 calls);
# compare_main=false scores the branch alone against the 80% gate, and
# require_all_cases=true restores the old every-case bar.
#
#   gh workflow run eval-fhir-manual.yml -f ref=feat/my-branch
#
# The branch's own code runs with the Gemini secret, so only dispatch branches
# you trust (only collaborators can dispatch at all).

name: eval (FHIR, manual, any branch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to evaluate"
        required: true
      runs:
        description: "Runs per case"
        required: false
        default: "3"
      compare_main:
        description: "Also score main and pass only if the branch is at least as accurate (2 sweeps of quota)"
        type: boolean
        required: false
        default: true
      require_all_cases:
        description: "Also fail unless every case passes (majority of its runs) -- the old bar"
        type: boolean
        required: false
        default: false
      cases:
        description: "Only these case ids, comma-separated (empty = all 28). For a cheap targeted check."
        required: false
        default: ""

concurrency:
  group: gemini-eval        # one Gemini sweep at a time: they share a quota
  cancel-in-progress: false

jobs:
  fhir-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify required secret is present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Missing secret::GEMINI_API_KEY is not set for this repository."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt pyarrow   # pyarrow: build_fhir_gold._to_arrow

      # RESTORE only, never save: this job runs a branch's own code, and a cache it
      # saved would be scoped to the default branch, where a branch could poison
      # the FHIR Gold every main job then reads (CodeQL: cache poisoning). The
      # nightly job, which runs main's code, is the one that saves this cache.
      - name: Restore FHIR Gold cache
        id: fhir-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/synthea
            medallion/fhir_gold.duckdb
          key: fhir-gold-${{ hashFiles('fetch_synthea.py', 'build_fhir_gold.py') }}

      - name: Build FHIR Gold (on cache miss)
        if: steps.fhir-cache.outputs.cache-hit != 'true'
        run: |
          python fetch_synthea.py
          python build_fhir_gold.py

      - name: Check out main beside it (to compare)
        if: inputs.compare_main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main_ref

      - name: Run FHIR eval (branch)
        id: branch
        env:
          EVAL_OUT_DIR: ${{ github.workspace }}/eval_runs/branch
          COMPARE_MAIN: ${{ inputs.compare_main }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANNER_PROVIDER: "gemini"
          PLANNER_MIN_INTERVAL_SEC: "5"
          EVAL_DATASET: "fhir"
          PLANNER_SCHEMA: "fhir"
          RUNS: ${{ inputs.runs }}
          EVAL_CASES: ${{ inputs.cases }}
        run: |
          set +e
          python -u eval_harness.py --runs "$RUNS"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Provider unavailable::Inconclusive: Gemini was unavailable for most runs. Not a regression, but not a pass either."
          fi
          echo "rc=$code" >> "$GITHUB_OUTPUT"
          # comparing: the verdict is the comparison's, so main still runs
          if [ "$COMPARE_MAIN" != "true" ]; then exit $code; fi

      - name: Run FHIR eval (main, same Gold)
        if: inputs.compare_main
        working-directory: main_ref
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANNER_PROVIDER: "gemini"
          PLANNER_MIN_INTERVAL_SEC: "5"
          EVAL_DATASET: "fhir"
          PLANNER_SCHEMA: "fhir"
          RUNS: ${{ inputs.runs }}
          EVAL_CASES: ${{ inputs.cases }}
          EVAL_OUT_DIR: ${{ github.workspace }}/eval_runs/main
        run: |
          mkdir -p medallion
          cp ../medallion/fhir_gold.duckdb medallion/fhir_gold.duckdb
          python -u eval_harness.py --runs "$RUNS" || true

      # main's copy of the script, so a branch cannot ship a lenient comparison
      # by accident. Not a defence against a hostile branch: its code runs
      # first in the same workspace (and with the Gemini secret) -- only
      # dispatch branches you trust, as the header says.
      - name: Branch vs main
        if: inputs.compare_main
        run: python main_ref/scripts/compare_evals.py eval_runs/branch eval_runs/main

      - name: Require every case to pass
        if: inputs.require_all_cases
        run: |
          python - <<'PY'
          import glob, json, os, sys
          path = max(glob.glob("eval_runs/branch/eval_*_fhir_*.json"), key=os.path.getmtime)
          r = json.load(open(path))
          failed = [c for c in r["cases"] if not c["passed"]]
          for c in r["cases"]:
              print(f"{'PASS' if c['passed'] else 'FAIL'} {c['id']}: {c['correct_runs']}/{c['runs']}  {c['sample_detail']}")
          if failed:
              print(f"::error title=Not every case passed::{len(failed)} of {len(r['cases'])} failed: "
                    + ", ".join(c["id"] for c in failed))
              sys.exit(1)
          print(f"all {len(r['cases'])} cases passed")
          PY

      - name: Upload FHIR eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-fhir-${{ github.run_id }}
          path: eval_runs/
